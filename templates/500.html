{% extends 'base.html' %}
{% load static %}

{% block content %}

    <div class="col-md-8 col-lg-6">

            <h1 class="display-1 fw-bold text-gradient mb-3">500</h1>
            <h2 class="fw-bold mb-4">Error Interno del Servidor</h2>
