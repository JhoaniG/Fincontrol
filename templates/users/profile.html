{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-circle fs-1 text-gradient mb-2" style="font-size: 4rem !important;"></i>
                <h2 class="fw-bold mb-1" style="color: var(--text-main);">Mi Perfil</h2>
                <p style="color: var(--text-muted);">Gestiona tu información personal y preferencias</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="color: var(--text-main);">Nombre Completo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="full_name" class="form-control border-start-0" value="{{ user.first_name }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" style="color: var(--text-main);">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control border-start-0" value="{{ user.email }}" disabled>
                    </div>
                    <small style="color: var(--text-muted);">El correo no se puede cambiar.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" style="color: var(--text-main);">Moneda Principal</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);">
                            <i class="fa-solid fa-coins"></i>
                        </span>
                        <select name="currency" class="form-select border-start-0" required>
                            <option value="COP" {% if user.preferred_currency == 'COP' %}selected{% endif %}>Pesos Colombianos (COP)</option>
                            <option value="USD" {% if user.preferred_currency == 'USD' %}selected{% endif %}>Dólares (USD)</option>
                            <option value="EUR" {% if user.preferred_currency == 'EUR' %}selected{% endif %}>Euros (EUR)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold" style="color: var(--text-main);">Tipo de Actividad</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);">
                            <i class="fa-solid fa-briefcase"></i>
                        </span>
                        <select name="activity_type" class="form-select border-start-0" required>
                            <option value="empleado" {% if user.activity_type == 'empleado' %}selected{% endif %}>Empleado</option>
                            <option value="independiente" {% if user.activity_type == 'independiente' %}selected{% endif %}>Independiente</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold">
                    Guardar Cambios <i class="fa-solid fa-floppy-disk ms-2"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
