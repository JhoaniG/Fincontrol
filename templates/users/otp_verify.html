{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="glass-card text-center p-5">
            <h2 class="text-gradient fw-bold mb-4"><i class="fa-solid fa-mobile-screen-button"></i> Verificación OTP</h2>
            <p class="text-muted mb-4">Ingresa el código de 6 dígitos que enviamos a tu correo/SMS.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="text" name="code" class="form-control form-control-lg text-center fw-bold text-white fs-2 tracking-widest" placeholder="123456" maxlength="6" required style="letter-spacing: 0.5rem;">
                </div>
                <button type="submit" class="btn-primary-custom w-100">Verificar Código</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
